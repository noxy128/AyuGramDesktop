name: Build AyuGram Linux
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libalure-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libxcb-keysyms1-dev libxcb-record0-dev libxcb-screensaver0-dev libxcb-shape0-dev libxcb-util-dev libxcb-xfixes0-dev libx11-xcb-dev libdmx-dev libvpx-dev libwebp-dev libopus-dev libpcre2-dev libffi-dev libgcreg-dev libzstd-dev libssl-dev libcrypto++-dev

      - name: Build AyuGram
        run: |
          mkdir build && cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release ..
          ninja

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Linux-Binary
          path: build/AyuGram
